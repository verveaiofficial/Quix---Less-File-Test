<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
    <meta name="theme-color" content="#000000" />
    <title>Quix Chat</title>
    
    <!-- Bunny Fonts: Privacy-friendly, unblocked by Brave/Firefox -->
    <link rel="preconnect" href="https://fonts.bunny.net" />
    <link href="https://fonts.bunny.net/css?family=dm-sans:400,500,700|syne:700,800&display=swap" rel="stylesheet" />
    
    <style>
      *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { 
        margin: 0; 
        padding: 0; 
        background: #000; 
        overflow-x: hidden;
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      button, a, input, textarea, [role="button"] { 
        -webkit-tap-highlight-color: transparent; 
        touch-action: manipulation;
        font-family: inherit;
      }
      #root { min-height: 100vh; min-height: 100dvh; min-height: calc(var(--vh, 1vh) * 100); }
      
      .brand, .set-title, .quix-label, .auth-logo { 
        font-family: 'Syne', 'Arial Black', sans-serif; 
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Viewport height fix for Brave/Firefox drawer scrolling
      function setVH() {
        const vh = window.innerHeight * 0.01;
        document.documentElement.style.setProperty('--vh', `${vh}px`);
      }
      setVH();
      window.addEventListener('resize', setVH);
      window.addEventListener('orientationchange', setVH);
    </script>
  </body>
</html>
