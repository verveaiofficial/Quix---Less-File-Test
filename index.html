<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Quix Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root { color-scheme: dark; }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      *:focus,
      *:focus-visible,
      *:active {
        outline: none !important;
      }

      html, body {
        height: 100%;
        overflow: hidden;
        background: #000;
      }

      body {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: rgba(255,255,255,.85);
      }

      button, input, textarea { font-family: inherit; }

      /* drawer hugs the real screen, keyboard won't shove the footer */
      #drawer {
        top: 0 !important;
        bottom: 0 !important;
        height: auto !important;
      }

      /* glass depth */
      #chat-header {
        box-shadow: 0 8px 32px rgba(0,0,0,0.45),
                    0 1px 0 rgba(255,255,255,0.08) inset,
                    0 -1px 0 rgba(0,0,0,0.3) inset !important;
      }

      #chat-header::before,
      #drawer::before,
      .input-bar::before {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg,
                    rgba(255,255,255,0.07) 0%,
                    rgba(255,255,255,0.01) 60%,
                    transparent 100%);
        pointer-events: none;
        z-index: 0;
      }

      #drawer {
        background: rgba(255,255,255,0.045) !important;
        backdrop-filter: blur(40px) saturate(200%) brightness(1.1) !important;
        -webkit-backdrop-filter: blur(40px) saturate(200%) brightness(1.1) !important;
        box-shadow: 8px 0 32px rgba(0,0,0,0.45),
                    1px 0 0 rgba(255,255,255,0.08) inset,
                    -1px 0 0 rgba(0,0,0,0.3) inset !important;
      }

      .input-bar {
        box-shadow: 0 8px 32px rgba(0,0,0,0.45),
                    0 1px 0 rgba(255,255,255,0.08) inset,
                    0 -1px 0 rgba(0,0,0,0.3) inset !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
